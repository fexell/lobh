[build]
  command = "npm run build"
  publish = "dist/client"

[dev]
  command = "npm run dev"

# Set immutable caching for static files, because they have fingerprinted filenames
[[headers]]
for = "/assets/*"
[headers.values]
"Cache-Control" = "public, max-age=31560000, immutable"

[functions]
  node_bundler = "esbuild"
  external_node_modules = []

[[redirects]]
  from = "/*"
  to = "https://ljudochbildhornan.se/:splat"
  status = 301
  force = true
  conditions = {Host = ["lobh.se"]}

[[redirects]]
  from = "/*"
  to = "https://ljudochbildhornan.se/:splat"
  status = 301
  force = true
  conditions = {Host = ["www.lobh.se"]}
