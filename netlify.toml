[build]
  command = "npm run build"
  publish = "dist/client"

[dev]
  command = "npm run dev"

# Set immutable caching for static files, because they have fingerprinted filenames
[[headers]]
for = "/assets/*"
[headers.values]
"Cache-Control" = "public, max-age=31560000, immutable"

[functions]
  node_bundler = "esbuild"
  external_node_modules = []

[[redirects]]
  from = "https://lobh.se/*"
  to = "https://ljudochbildhornan.se/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.lobh.se/*"
  to = "https://ljudochbildhornan.se/:splat"
  status = 301
  force = true